<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>교사 대시보드 — 오산고 1학년</title>
<style>
  :root {
    --blue:#185FA5; --blue-l:#E6F1FB; --blue-m:#378ADD;
    --green:#1D9E75; --green-l:#EAF3DE; --green-d:#27500A;
    --purple:#534AB7; --amber:#BA7517; --amber-l:#FAEEDA;
    --red:#A32D2D; --red-l:#FCEBEB;
    --bg:#f8f8f6; --surface:#fff; --border:#e0dfd8;
    --text:#1a1a18; --muted:#6b6a65;
    --radius:10px; --radius-sm:6px;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Pretendard','Apple SD Gothic Neo',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
  button, input, select { font:inherit; }

  .lock-screen { position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center; z-index:999; }
  .lock-box { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:32px 24px; width:min(320px, calc(100vw - 32px)); text-align:center; }
  .lock-icon { font-size:40px; margin-bottom:12px; }
  .lock-title { font-size:16px; font-weight:600; margin-bottom:4px; }
  .lock-sub { font-size:13px; color:var(--muted); margin-bottom:20px; }
  .lock-input { width:100%; padding:11px 14px; border:1px solid var(--border); border-radius:var(--radius-sm); font-size:15px; text-align:center; letter-spacing:4px; outline:none; margin-bottom:10px; }
  .lock-input:focus { border-color:var(--blue-m); }
  .lock-btn { width:100%; padding:11px; background:var(--blue); color:#fff; border:none; border-radius:var(--radius-sm); font-size:14px; font-weight:600; cursor:pointer; }
  .lock-btn:hover { background:#0C447C; }
  .lock-error { font-size:12px; color:var(--red); margin-top:8px; display:none; }

  .app-body { display:none; }
  .header { background:var(--surface); border-bottom:1px solid var(--border); padding:14px 16px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:10; gap:12px; }
  .header-title { font-size:16px; font-weight:600; }
  .header-sub { font-size:12px; color:var(--muted); margin-top:2px; }
  .header-right { display:flex; align-items:center; gap:8px; flex-shrink:0; }
  .dday-badge { background:var(--red-l); color:var(--red); font-size:12px; font-weight:600; padding:4px 10px; border-radius:20px; white-space:nowrap; }
  .logout-btn { font-size:12px; color:var(--muted); background:none; border:1px solid var(--border); border-radius:var(--radius-sm); padding:4px 10px; cursor:pointer; white-space:nowrap; }
  .tab-wrap { background:var(--surface); border-bottom:1px solid var(--border); display:flex; overflow-x:auto; }
  .tab-btn { flex:1; min-width:128px; padding:12px 8px; border:none; background:none; font-size:13px; color:var(--muted); cursor:pointer; border-bottom:2px solid transparent; white-space:nowrap; transition:all .15s; }
  .tab-btn.active { color:var(--blue); border-bottom-color:var(--blue); font-weight:600; }
  .content { max-width:640px; margin:0 auto; padding:16px; }
  .tab-panel { display:none; }
  .tab-panel.active { display:block; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px; margin-bottom:12px; }
  .card-title { font-size:14px; font-weight:600; margin-bottom:12px; display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .btn { padding:11px 16px; border:none; border-radius:var(--radius-sm); font-size:14px; font-weight:600; cursor:pointer; transition:all .15s; width:100%; }
  .btn-primary { background:var(--blue); color:#fff; }
  .btn-primary:hover { background:#0C447C; }
  .student-link { display:block; text-align:center; padding:12px; background:var(--green-l); border:1px solid #9FD57A; border-radius:var(--radius-sm); font-size:13px; color:var(--green-d); font-weight:600; text-decoration:none; margin-bottom:12px; }
  .student-link:hover { background:#d5edbb; }

  .metric-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:12px; }
  .metric { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:12px; text-align:center; min-width:0; }
  .metric-label { font-size:11px; color:var(--muted); margin-bottom:4px; white-space:nowrap; }
  .metric-val { font-size:22px; font-weight:700; line-height:1.15; overflow-wrap:anywhere; }
  .metric-unit { font-size:11px; color:var(--muted); }

  .bar-row { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .bar-row:last-child { margin-bottom:0; }
  .bar-label { font-size:12px; color:var(--muted); width:72px; text-align:right; flex-shrink:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bar-track { flex:1; height:8px; background:var(--bg); border-radius:4px; overflow:hidden; }
  .bar-fill { height:100%; border-radius:4px; transition:width .5s; }
  .bar-val { font-size:11px; color:var(--muted); width:44px; text-align:right; }

  .stu-row { display:flex; align-items:center; gap:8px; padding:9px 0; border-bottom:1px solid var(--border); font-size:13px; }
  .stu-row:last-child { border-bottom:none; }
  .stu-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .stu-name { width:72px; font-weight:600; flex-shrink:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .stu-bar { flex:1; height:6px; background:var(--bg); border-radius:3px; overflow:hidden; min-width:50px; }
  .stu-bar-fill { height:100%; border-radius:3px; background:var(--blue-m); }
  .stu-hours { width:46px; text-align:right; color:var(--muted); font-size:12px; }
  .badge { display:inline-block; font-size:11px; font-weight:600; padding:2px 8px; border-radius:10px; white-space:nowrap; }

  .toolbar { display:flex; gap:8px; margin-bottom:12px; }
  .search-input { width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:var(--radius-sm); font-size:14px; color:var(--text); background:var(--surface); outline:none; }
  .search-input:focus { border-color:var(--blue-m); }
  .student-list { display:flex; flex-direction:column; gap:6px; max-height:300px; overflow:auto; }
  .student-card { width:100%; display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 12px; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--surface); color:var(--text); cursor:pointer; text-align:left; transition:all .15s; }
  .student-card:hover { border-color:var(--blue-m); background:var(--blue-l); }
  .student-card.active { border-color:var(--blue); background:var(--blue-l); box-shadow:inset 3px 0 0 var(--blue); }
  .student-card-main { display:flex; align-items:center; gap:8px; min-width:0; }
  .student-card-name { font-size:14px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .student-card-meta { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); flex-shrink:0; }
  .status-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .status-pill { display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:700; padding:5px 9px; border-radius:14px; white-space:nowrap; }
  .status-pill.done { background:var(--green-l); color:var(--green-d); }
  .status-pill.missing { background:var(--red-l); color:var(--red); }

  .detail-head { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:14px; }
  .detail-label { font-size:11px; color:var(--muted); margin-bottom:2px; }
  .detail-name { font-size:20px; font-weight:800; line-height:1.2; }
  .detail-note { background:var(--blue-l); border-radius:var(--radius-sm); color:#0C447C; font-size:12px; line-height:1.6; padding:10px 12px; margin:2px 0 14px; }
  .mini-title { font-size:13px; font-weight:700; margin:16px 0 8px; color:var(--text); }
  .trend { height:118px; display:grid; grid-template-columns:repeat(7,1fr); gap:8px; align-items:end; padding-top:8px; }
  .trend-col { display:flex; flex-direction:column; align-items:center; gap:6px; height:100%; min-width:0; }
  .trend-bar-wrap { flex:1; width:100%; display:flex; align-items:end; justify-content:center; }
  .trend-bar { width:18px; min-height:3px; border-radius:9px 9px 3px 3px; background:var(--blue-m); transition:height .5s; }
  .trend-date { font-size:11px; color:var(--muted); }
  .empty-state { color:var(--muted); font-size:13px; text-align:center; padding:20px 8px; line-height:1.6; }
  .loading { color:var(--muted); font-size:13px; text-align:center; padding:20px; }
  .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#1a1a18; color:#fff; font-size:13px; padding:10px 20px; border-radius:20px; opacity:0; transition:opacity .3s; pointer-events:none; z-index:200; white-space:nowrap; }
  .toast.show { opacity:1; }

  @media (max-width:520px) {
    .content { padding:12px; }
    .metric-grid { grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px; }
    .metric { padding:10px 6px; }
    .metric-label { font-size:10px; }
    .metric-val { font-size:20px; }
    .stu-row { gap:6px; }
    .stu-name { width:58px; }
    .badge { display:none; }
    .bar-label { width:58px; }
    .detail-head { flex-direction:column; }
  }
</style>
</head>
<body>

<div class="lock-screen" id="lock-screen">
  <div class="lock-box">
    <div class="lock-icon">🔒</div>
    <div class="lock-title">교사 전용 페이지</div>
    <div class="lock-sub">비밀번호를 입력해주세요</div>
    <input class="lock-input" type="password" id="pw-input" placeholder="••••" maxlength="8">
    <button class="lock-btn" onclick="checkPassword()">입장하기</button>
    <div class="lock-error" id="lock-error">비밀번호가 틀렸습니다</div>
  </div>
</div>

<div class="app-body" id="app-body">
  <div class="header">
    <div>
      <div class="header-title">👩‍🏫 교사 대시보드</div>
      <div class="header-sub">오산고 1학년 — 교사 전용</div>
    </div>
    <div class="header-right">
      <div class="dday-badge" id="dday-badge">D-??</div>
      <button class="logout-btn" onclick="logout()">🔒 잠금</button>
    </div>
  </div>

  <div class="tab-wrap">
    <button class="tab-btn active" data-tab="overview">📊 전체 현황</button>
    <button class="tab-btn" data-tab="individual">🧑‍🎓 학생 개별 현황</button>
  </div>

  <div class="content">
    <div class="tab-panel active" id="panel-overview">
      <a class="student-link" href="index.html" target="_blank">
        🔗 학생용 페이지 열기
      </a>
      <div class="metric-grid">
        <div class="metric"><div class="metric-label">오늘 입력 완료</div><div class="metric-val" id="t-submitted" style="color:var(--green-d)">--</div><div class="metric-unit">명</div></div>
        <div class="metric"><div class="metric-label">미입력</div><div class="metric-val" id="t-missing" style="color:var(--red)">--</div><div class="metric-unit">명</div></div>
        <div class="metric"><div class="metric-label">오늘 평균</div><div class="metric-val" id="t-avg">--</div><div class="metric-unit">h</div></div>
      </div>
      <div class="card">
        <div class="card-title">학생별 누적 학습</div>
        <div id="overview-students"><div class="loading">데이터 불러오는 중...</div></div>
      </div>
      <div class="card">
        <div class="card-title">과목별 학습 비율</div>
        <div id="overview-subjects"><div class="loading">데이터 불러오는 중...</div></div>
      </div>
      <div class="card">
        <div class="card-title">오늘 미입력 학생</div>
        <div id="overview-missing" style="font-size:13px;color:var(--muted);line-height:1.6"></div>
      </div>
      <button class="btn btn-primary" onclick="loadDashboard()">새로고침</button>
    </div>

    <div class="tab-panel" id="panel-individual">
      <div class="card">
        <div class="card-title">학생 선택</div>
        <div class="toolbar">
          <input class="search-input" id="student-search" placeholder="이름으로 검색" autocomplete="off">
        </div>
        <div class="student-list" id="individual-list">
          <div class="loading">학생 목록 불러오는 중...</div>
        </div>
      </div>
      <div class="card">
        <div class="card-title">개별 현황</div>
        <div id="individual-detail">
          <div class="empty-state">학생을 선택하면 개별 학습 현황이 표시됩니다.</div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SCRIPT_URL  = 'https://script.google.com/macros/s/AKfycbyhVex-Mhpqza8RwWJ3ZhbVBuBW0afyckgTgMlfZVQvZbzWbYlR8So4dzKNqQKaAsd3cw/exec';
const TEACHER_PW  = '1203';
const EXAM_DATE   = '2026-07-01';
const COLORS = ['#378ADD','#1D9E75','#7F77DD','#D85A30','#BA7517','#D4537E','#639922','#185FA5'];

let dashboardData = null;
let studentStats = [];
let selectedStudentName = '';
let detailRequestId = 0;
let appInitialized = false;

function checkPassword() {
  const val = document.getElementById('pw-input').value;
  if (val === TEACHER_PW) {
    document.getElementById('lock-screen').style.display = 'none';
    document.getElementById('app-body').style.display = 'block';
    sessionStorage.setItem('teacher_auth', '1');
    initApp();
  } else {
    document.getElementById('lock-error').style.display = 'block';
    document.getElementById('pw-input').value = '';
    document.getElementById('pw-input').focus();
  }
}

function logout() {
  sessionStorage.removeItem('teacher_auth');
  document.getElementById('lock-screen').style.display = 'flex';
  document.getElementById('app-body').style.display = 'none';
  document.getElementById('pw-input').value = '';
  document.getElementById('lock-error').style.display = 'none';
}

document.addEventListener('DOMContentLoaded', () => {
  if (sessionStorage.getItem('teacher_auth') === '1') {
    document.getElementById('lock-screen').style.display = 'none';
    document.getElementById('app-body').style.display = 'block';
    initApp();
  }
  document.getElementById('pw-input').addEventListener('keydown', e => { if(e.key === 'Enter') checkPassword(); });
});

function initApp() {
  updateDday();
  if (!appInitialized) {
    document.querySelectorAll('.tab-btn').forEach(b => b.addEventListener('click', () => switchTab(b.dataset.tab)));
    document.getElementById('student-search').addEventListener('input', renderIndividualList);
    appInitialized = true;
  }
  loadDashboard();
}

function updateDday() {
  const diff = Math.ceil((new Date(EXAM_DATE) - new Date()) / 86400000);
  const el = document.getElementById('dday-badge');
  if (el) el.textContent = diff > 0 ? `D-${diff}` : diff === 0 ? 'D-Day!' : '시험 종료';
}

function switchTab(name) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + name));
  if (name === 'overview') loadDashboard();
  if (name === 'individual') {
    renderIndividualList();
    if (!selectedStudentName && studentStats.length) selectStudent(studentStats[0].name);
  }
}

async function loadDashboard() {
  if (SCRIPT_URL === 'YOUR_APPS_SCRIPT_URL_HERE') {
    const demo = {
      ok:true, submittedCount:4, notSubmittedCount:2, todayAvgHours:3.2,
      notSubmitted:['오예린','신태양'],
      studentStats:[
        {name:'김민준',totalHours:22.5,submittedToday:true},{name:'이서연',totalHours:18.5,submittedToday:true},
        {name:'박지호',totalHours:16.0,submittedToday:true},{name:'최유진',totalHours:14.5,submittedToday:true},
        {name:'정수아',totalHours:9.0,submittedToday:false},{name:'한도윤',totalHours:7.5,submittedToday:false}],
      subjectStats:[{name:'수학',hours:32,pct:100},{name:'통합과학',hours:28,pct:88},
        {name:'영어',hours:24,pct:75},{name:'국어',hours:20,pct:63},{name:'한국사',hours:14,pct:44}]
    };
    return applyDashboardData(demo);
  }
  try {
    const r = await fetch(SCRIPT_URL + '?action=dashboard');
    const d = await r.json();
    if (d.ok) applyDashboardData(d);
  } catch(e) {
    showToast('전체 현황 로드 실패');
  }
}

function applyDashboardData(d) {
  dashboardData = normalizeDashboard(d);
  studentStats = [...dashboardData.studentStats].sort((a,b) => (b.totalHours || 0) - (a.totalHours || 0));
  if (!studentStats.some(s => s.name === selectedStudentName)) {
    selectedStudentName = studentStats[0]?.name || '';
  }
  renderOverview(dashboardData);
  renderIndividualList();
  if (document.getElementById('panel-individual').classList.contains('active') && selectedStudentName) {
    selectStudent(selectedStudentName);
  }
}

function normalizeDashboard(d) {
  const students = Array.isArray(d.studentStats) ? d.studentStats : [];
  const subjects = Array.isArray(d.subjectStats) ? d.subjectStats : [];
  const notSubmitted = Array.isArray(d.notSubmitted) ? d.notSubmitted : [];
  return {
    submittedCount: numberOrDash(d.submittedCount),
    notSubmittedCount: numberOrDash(d.notSubmittedCount),
    todayAvgHours: numberOrDash(d.todayAvgHours),
    notSubmitted,
    studentStats: students.map(s => ({
      name: String(s.name || ''),
      totalHours: Number(s.totalHours || 0),
      submittedToday: Boolean(s.submittedToday)
    })).filter(s => s.name),
    subjectStats: subjects.map(s => ({
      name: String(s.name || ''),
      hours: Number(s.hours || 0),
      pct: Number(s.pct || 0)
    })).filter(s => s.name)
  };
}

function renderOverview(d) {
  document.getElementById('t-submitted').textContent = d.submittedCount;
  document.getElementById('t-missing').textContent = d.notSubmittedCount;
  document.getElementById('t-avg').textContent = d.todayAvgHours;

  const studentsEl = document.getElementById('overview-students');
  if (!d.studentStats.length) {
    studentsEl.innerHTML = '<div class="empty-state">아직 학생 기록이 없습니다.</div>';
  } else {
    const maxH = Math.max(...d.studentStats.map(s => s.totalHours), 1);
    studentsEl.innerHTML = d.studentStats.map(s => {
      const pct = Math.round(s.totalHours / maxH * 100);
      return `<div class="stu-row">
        <div class="stu-dot" style="background:${s.submittedToday ? '#1D9E75' : '#E24B4A'}"></div>
        <div class="stu-name" title="${escapeAttr(s.name)}">${escapeHTML(s.name)}</div>
        <div class="stu-bar"><div class="stu-bar-fill" style="width:${pct}%"></div></div>
        <div class="stu-hours">${formatHours(s.totalHours)}h</div>
        ${levelBadge(s.totalHours)}
      </div>`;
    }).join('');
  }

  const subjectsEl = document.getElementById('overview-subjects');
  if (!d.subjectStats.length) {
    subjectsEl.innerHTML = '<div class="empty-state">아직 과목별 기록이 없습니다.</div>';
  } else {
    subjectsEl.innerHTML = d.subjectStats.map((s,i) => `
      <div class="bar-row">
        <div class="bar-label" title="${escapeAttr(s.name)}">${escapeHTML(s.name)}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.min(s.pct, 100)}%;background:${COLORS[i % COLORS.length]}"></div></div>
        <div class="bar-val">${formatHours(s.hours)}h</div>
      </div>`).join('');
  }

  document.getElementById('overview-missing').textContent =
    d.notSubmitted.length ? d.notSubmitted.join(', ') : '모두 제출 완료';
}

function renderIndividualList() {
  const list = document.getElementById('individual-list');
  const searchEl = document.getElementById('student-search');
  const query = (searchEl?.value || '').trim().toLowerCase();
  const filtered = studentStats.filter(s => s.name.toLowerCase().includes(query));

  if (!studentStats.length) {
    list.innerHTML = '<div class="empty-state">학생 현황을 불러오지 못했습니다.</div>';
    return;
  }
  if (!filtered.length) {
    list.innerHTML = '<div class="empty-state">검색 결과가 없습니다.</div>';
    return;
  }

  list.innerHTML = filtered.map(s => `
    <button class="student-card ${s.name === selectedStudentName ? 'active' : ''}" data-name="${escapeAttr(s.name)}" type="button">
      <span class="student-card-main">
        <span class="status-dot" style="background:${s.submittedToday ? '#1D9E75' : '#E24B4A'}"></span>
        <span class="student-card-name">${escapeHTML(s.name)}</span>
      </span>
      <span class="student-card-meta">
        <span>${formatHours(s.totalHours)}h</span>
        <span>${getStudentRank(s.name)}위</span>
      </span>
    </button>`).join('');

  list.querySelectorAll('.student-card').forEach(btn => {
    btn.addEventListener('click', () => selectStudent(btn.dataset.name));
  });
}

async function selectStudent(name) {
  selectedStudentName = name;
  renderIndividualList();
  const stat = studentStats.find(s => s.name === name) || {name, totalHours:0, submittedToday:false};
  const requestId = ++detailRequestId;
  document.getElementById('individual-detail').innerHTML = '<div class="loading">개별 현황 불러오는 중...</div>';
  const data = await loadStudentDetail(name);
  if (requestId !== detailRequestId) return;
  renderStudentDetail(stat, data);
}

async function loadStudentDetail(name) {
  if (SCRIPT_URL === 'YOUR_APPS_SCRIPT_URL_HERE') return buildDemoStudentDetail(name);
  try {
    const r = await fetch(`${SCRIPT_URL}?action=mydata&name=${encodeURIComponent(name)}`);
    const d = await r.json();
    if (d.ok) return normalizeStudentDetail(d);
  } catch(e) {}
  showToast('개별 현황 로드 실패');
  return null;
}

function renderStudentDetail(stat, data) {
  const el = document.getElementById('individual-detail');
  if (!data) {
    el.innerHTML = '<div class="empty-state">개별 데이터를 불러오지 못했습니다. 잠시 후 다시 시도해주세요.</div>';
    return;
  }

  const rank = getStudentRank(stat.name);
  const classAvg = getClassAverage();
  const diff = Math.round(((stat.totalHours || 0) - classAvg) * 10) / 10;
  const diffText = diff >= 0 ? `반 평균보다 ${formatHours(diff)}h 많음` : `반 평균보다 ${formatHours(Math.abs(diff))}h 적음`;
  const subjectHTML = renderSubjectBars(data.subjectHours || []);
  const trendHTML = renderTrend(data.recent7 || []);

  el.innerHTML = `
    <div class="detail-head">
      <div>
        <div class="detail-label">선택 학생</div>
        <div class="detail-name">${escapeHTML(stat.name)}</div>
      </div>
      <span class="status-pill ${stat.submittedToday ? 'done' : 'missing'}">
        <span class="status-dot" style="background:${stat.submittedToday ? '#1D9E75' : '#E24B4A'}"></span>
        ${stat.submittedToday ? '오늘 제출 완료' : '오늘 미입력'}
      </span>
    </div>
    <div class="metric-grid">
      <div class="metric"><div class="metric-label">누적 학습</div><div class="metric-val">${formatHours(data.totalHours)}</div><div class="metric-unit">h</div></div>
      <div class="metric"><div class="metric-label">연속 기록</div><div class="metric-val">${data.streak || 0}</div><div class="metric-unit">일</div></div>
      <div class="metric"><div class="metric-label">평균 이해도</div><div class="metric-val">${data.avgUnderstanding || '--'}</div><div class="metric-unit">/ 5</div></div>
    </div>
    <div class="detail-note">전체 ${rank}위 · 반 평균 ${formatHours(classAvg)}h · ${diffText}</div>
    <div class="mini-title">과목별 누적 학습</div>
    ${subjectHTML}
    <div class="mini-title">최근 7일 추이</div>
    ${trendHTML}
  `;
}

function renderSubjectBars(subjectHours) {
  if (!subjectHours.length) {
    return '<div class="empty-state">아직 과목별 기록이 없습니다.</div>';
  }
  const maxH = Math.max(...subjectHours.map(s => s.hours), 1);
  return subjectHours.map((s,i) => `
    <div class="bar-row">
      <div class="bar-label" title="${escapeAttr(s.name)}">${escapeHTML(s.name)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.round(s.hours / maxH * 100)}%;background:${COLORS[i % COLORS.length]}"></div></div>
      <div class="bar-val">${formatHours(s.hours)}h</div>
    </div>`).join('');
}

function renderTrend(recent7) {
  const days = ['월','화','수','목','금','토','일'];
  const rows = recent7.length ? recent7 : days.map(() => ({hours:0}));
  const maxT = Math.max(...rows.map(r => Number(r.hours || 0)), 1);
  return `<div class="trend">${rows.slice(0, 7).map((r,i) => {
    const hours = Number(r.hours || 0);
    const height = hours > 0 ? Math.max(Math.round(hours / maxT * 100), 4) : 3;
    const opacity = hours > 0 ? 0.5 + hours / maxT * 0.5 : 0.15;
    const label = getTrendLabel(r, i);
    return `<div class="trend-col">
      <div class="trend-bar-wrap"><div class="trend-bar" title="${formatHours(hours)}h" style="height:${height}%;opacity:${opacity}"></div></div>
      <div class="trend-date">${label}</div>
    </div>`;
  }).join('')}</div>`;
}

function normalizeStudentDetail(d) {
  return {
    totalHours: Number(d.totalHours || 0),
    streak: Number(d.streak || 0),
    avgUnderstanding: d.avgUnderstanding || 0,
    subjectHours: Array.isArray(d.subjectHours)
      ? d.subjectHours.map(s => ({name:String(s.name || ''), hours:Number(s.hours || 0)})).filter(s => s.name)
      : [],
    recent7: Array.isArray(d.recent7)
      ? d.recent7.map(r => ({date:r.date || '', hours:Number(r.hours || 0)}))
      : []
  };
}

function buildDemoStudentDetail(name) {
  const stat = studentStats.find(s => s.name === name) || {totalHours:0};
  const base = Math.max(stat.totalHours, 1);
  return normalizeStudentDetail({
    totalHours: base,
    streak: stat.submittedToday ? 4 : 0,
    avgUnderstanding: stat.submittedToday ? 4.1 : 3.2,
    subjectHours: [
      {name:'수학', hours:Math.round(base * 0.35 * 10) / 10},
      {name:'통합과학', hours:Math.round(base * 0.25 * 10) / 10},
      {name:'영어', hours:Math.round(base * 0.2 * 10) / 10},
      {name:'국어', hours:Math.round(base * 0.12 * 10) / 10},
      {name:'한국사', hours:Math.round(base * 0.08 * 10) / 10}
    ],
    recent7: [0.5,1.2,0,2.1,1.4,0.8,1.7].map(hours => ({hours}))
  });
}

function levelBadge(totalHours) {
  if (totalHours >= 20) return '<span class="badge" style="background:var(--green-l);color:var(--green-d)">우수</span>';
  if (totalHours >= 12) return '<span class="badge" style="background:var(--blue-l);color:#0C447C">양호</span>';
  if (totalHours >= 6) return '<span class="badge" style="background:var(--amber-l);color:var(--amber)">관심</span>';
  return '<span class="badge" style="background:var(--red-l);color:var(--red)">주목</span>';
}

function getStudentRank(name) {
  const idx = studentStats.findIndex(s => s.name === name);
  return idx === -1 ? '-' : idx + 1;
}

function getClassAverage() {
  if (!studentStats.length) return 0;
  const total = studentStats.reduce((sum, s) => sum + (s.totalHours || 0), 0);
  return Math.round(total / studentStats.length * 10) / 10;
}

function formatHours(value) {
  const n = Number(value || 0);
  if (!Number.isFinite(n)) return '0';
  return Number.isInteger(n) ? String(n) : n.toFixed(1);
}

function getTrendLabel(row, index) {
  if (row?.date) {
    const d = new Date(row.date);
    if (!Number.isNaN(d.getTime())) return `${d.getMonth() + 1}/${d.getDate()}`;
  }
  return ['월','화','수','목','금','토','일'][index] || '';
}

function numberOrDash(value) {
  return value === undefined || value === null || value === '' ? '--' : value;
}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, ch => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[ch]));
}

function escapeAttr(value) {
  return escapeHTML(value);
}

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}
</script>
</body>
</html>
